apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  selector:
    matchLabels:
      app: worker
  replicas: 1
  # The node may not have room for a second worker's memory request during an update
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: aswinanilnair/demucs-worker:v1
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "1"
            memory: 6Gi
        env:
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: S3_ENDPOINT
          value: "http://rustfs:9000"
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-credentials
              key: access-key
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: rustfs-credentials
              key: secret-key
